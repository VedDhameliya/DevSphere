{% extends "base.html" %}

{% block title %}Create Team | DevSphere{% endblock %}

{% block content %}
<section class="page-header">
    <h1 class="page-title">Create a Team</h1>
    <p class="muted">Create a new team for {{ project.name }}.</p>
</section>

<section class="card">
    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="name">Team Name</label>
            <input
                class="form-control"
                type="text"
                id="name"
                name="name"
                placeholder="Enter team name"
                maxlength="100"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea
                class="form-control"
                id="description"
                name="description"
                rows="5"
                placeholder="Describe your team..."
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Create Team
        </button>

        <a href="{{ url_for('teams.list_teams', project_id=project.id) }}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>
</section>
{% endblock %}
